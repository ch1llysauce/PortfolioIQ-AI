<div class="sidebar-header-row flex-between">
      <div class="sidebar-brand">
        <span class="logo">
          <img [src]="app.isDarkMode() ? '/portfolioiq.png' : '/portfolioiqlight.png'" alt="PortfolioIQ" class="logo-img" width="28" height="28" loading="eager" decoding="async" />PortfolioIQ<span class="logo-accent">.AI</span>
        </span>
      </div>
      <button class="btn-icon mobile-sidebar-close" (click)="app.closeMobileSidebar()" aria-label="Close Sidebar">
        <svg class="nav-svg" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <nav class="nav-menu">
      <button class="nav-item" [class.active]="app.activeTab() === 'dashboard'" (click)="app.setTab('dashboard')">
        <span class="nav-icon">
          <svg class="nav-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>
        </span>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" [class.active]="app.activeTab() === 'projects'" (click)="app.setTab('projects')">
        <span class="nav-icon">
          <svg class="nav-svg" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path></svg>
        </span>
        <span>Projects</span>
        <span class="nav-count" *ngIf="app.projects().length">{{ app.projects().length }}</span>
      </button>
      <button class="nav-item" [class.active]="app.activeTab() === 'skills'" (click)="app.setTab('skills')">
        <span class="nav-icon">
          <svg class="nav-svg" viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48 2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48 2.83-2.83"/><circle cx="12" cy="12" r="3.5"/></svg>
        </span>
        <span>My Skills</span>
        <span class="nav-count" *ngIf="app.currentUser() && app.getUserSkillNames().length">{{ app.getUserSkillNames().length }}</span>
      </button>
      <button class="nav-item" [class.active]="app.activeTab() === 'career'" (click)="app.setTab('career')">
        <span class="nav-icon">
          <svg class="nav-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
        </span>
        <span>Career & Optimizer</span>
      </button>
      <button class="nav-item" [class.active]="app.activeTab() === 'knowledge'" (click)="app.setTab('knowledge')">
        <span class="nav-icon">
          <svg class="nav-svg" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </span>
        <span>Knowledge Graph</span>
      </button>
      <button class="nav-item" [class.active]="app.activeTab() === 'resume'" (click)="app.setTab('resume')">
        <span class="nav-icon">
          <svg class="nav-svg" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
        </span>
        <span>Resume Extractor</span>
      </button>
      <button class="nav-item" [class.active]="app.activeTab() === 'coach'" (click)="app.setTab('coach')">
        <span class="nav-icon">
          <svg class="nav-svg" viewBox="0 0 24 24"><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M12 4v4"></path><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M9 13v2"></path><path d="M15 13v2"></path></svg>
        </span>
        <span>AI Career Coach</span>
        <span class="nav-pill-badge" *ngIf="app.coachStatus()?.live">LIVE</span>
      </button>
      <button class="nav-item" [class.active]="app.activeTab() === 'github'" (click)="app.setTab('github')">
        <span class="nav-icon">
          <svg class="nav-svg" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
        </span>
        <span>GitHub Sync</span>
        <span class="nav-pill-badge-gh" *ngIf="app.githubScanData()?.repos?.length">{{ app.githubScanData()?.repos?.length }}</span>
      </button>
    </nav>
