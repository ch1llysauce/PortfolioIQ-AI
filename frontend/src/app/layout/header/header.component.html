<div class="header-left flex-align gap-sm">
        <button class="btn-icon mobile-menu-btn" (click)="app.toggleMobileSidebar()" aria-label="Open Navigation Menu">
          <svg class="nav-svg" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="header-title">
          <h1 *ngIf="app.activeTab() === 'dashboard'">
            <span class="desktop-title">Portfolio Dashboard</span>
            <span class="mobile-title">Dashboard</span>
          </h1>
          <h1 *ngIf="app.activeTab() === 'projects'">
            <span class="desktop-title">My Projects</span>
            <span class="mobile-title">Projects</span>
          </h1>
          <h1 *ngIf="app.activeTab() === 'skills'">
            <span class="desktop-title">Skills Profile</span>
            <span class="mobile-title">Skills</span>
          </h1>
          <h1 *ngIf="app.activeTab() === 'career'">
            <span class="desktop-title">Career Optimizer</span>
            <span class="mobile-title">Career</span>
          </h1>
          <h1 *ngIf="app.activeTab() === 'knowledge'">
            <span class="desktop-title">Knowledge Graph</span>
            <span class="mobile-title">Knowledge</span>
          </h1>
          <h1 *ngIf="app.activeTab() === 'resume'">
            <span class="desktop-title">Resume Extractor</span>
            <span class="mobile-title">Resume</span>
          </h1>
          <h1 *ngIf="app.activeTab() === 'coach'">
            <span class="desktop-title">AI Career Coach</span>
            <span class="mobile-title">AI Coach</span>
          </h1>
          <h1 *ngIf="app.activeTab() === 'github'">
            <span class="desktop-title">GitHub Integration</span>
            <span class="mobile-title">GitHub Sync</span>
          </h1>
        </div>
      </div>

      <div class="user-auth-bar">
        <ng-container *ngIf="app.currentUser(); else authButtons">
          <div class="user-profile-widget flex-align gap-sm">
            <div 
              class="user-profile-badge clickable-profile-badge" 
              (click)="app.openProfileModal()" 
              role="button"
              tabindex="0"
              title="Click to view & edit Developer Profile">
              <div class="user-avatar-initial">
                <img *ngIf="app.getUserAvatar()" [src]="app.getUserAvatar()" alt="Avatar" class="user-avatar-img" />
                <span *ngIf="!app.getUserAvatar()">{{ app.getUserInitial() }}</span>
              </div>
              <div class="user-profile-info">
                <span class="user-display-name">{{ app.getUserDisplayName() }}</span>
                <span class="user-email-subtitle">{{ app.currentUser()?.email }}</span>
              </div>
              <svg class="profile-chevron-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
            <button class="btn-icon theme-toggle-btn" (click)="app.toggleTheme()" [title]="app.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
              <!-- Sun icon (shown in dark mode) -->
              <svg *ngIf="app.isDarkMode()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              <!-- Moon icon (shown in light mode) -->
              <svg *ngIf="!app.isDarkMode()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </button>
            <button class="btn btn-outline btn-sm header-signout-btn" (click)="app.confirmSignOut()" title="Sign out of your account">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <span>Sign Out</span>
            </button>
          </div>
        </ng-container>
        <ng-template #authButtons>
          <div class="header-auth-actions flex-align gap-sm">
            <button class="btn-icon theme-toggle-btn" (click)="app.toggleTheme()" [title]="app.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
              <svg *ngIf="app.isDarkMode()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              <svg *ngIf="!app.isDarkMode()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
              </svg>
            </button>
            <button class="btn btn-outline btn-sm" (click)="app.openAuthModal('login')">Sign In</button>
            <button class="btn btn-primary btn-sm" (click)="app.openAuthModal('register')">Get Started</button>
          </div>
        </ng-template>
      </div>
