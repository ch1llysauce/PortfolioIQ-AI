<!-- ============================================
     GLOBAL CONFIRMATION DIALOG MODAL
     ============================================ -->
<div class="modal-backdrop confirm-modal-backdrop" *ngIf="app.confirmDialog().isOpen" (click)="app.closeConfirmDialog(true)">
  <div class="modal-card confirm-modal-card" [class]="'confirm-' + app.confirmDialog().type" (click)="$event.stopPropagation()">
    
    <div class="confirm-modal-icon-row">
      <div class="confirm-icon-bubble" [class]="'bubble-' + app.confirmDialog().type">
        <!-- Success Icon -->
        <svg *ngIf="app.confirmDialog().icon === 'success'" class="confirm-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <!-- Logout Icon -->
        <svg *ngIf="app.confirmDialog().icon === 'logout'" class="confirm-svg" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        <!-- Delete Icon -->
        <svg *ngIf="app.confirmDialog().icon === 'delete'" class="confirm-svg" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        <!-- Warning Icon -->
        <svg *ngIf="app.confirmDialog().icon === 'warning'" class="confirm-svg" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        <!-- Info Icon -->
        <svg *ngIf="app.confirmDialog().icon === 'info'" class="confirm-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      </div>
    </div>

    <div class="confirm-modal-content">
      <h3 class="confirm-title">{{ app.confirmDialog().title }}</h3>
      <p class="confirm-message">{{ app.confirmDialog().message }}</p>
    </div>

    <div class="confirm-modal-actions">
      <button class="btn btn-secondary" *ngIf="app.confirmDialog().cancelText" (click)="app.closeConfirmDialog(false)">
        {{ app.confirmDialog().cancelText }}
      </button>
      <button 
        class="btn" 
        [class.btn-danger]="app.confirmDialog().type === 'danger'" 
        [class.btn-warning]="app.confirmDialog().type === 'warning'" 
        [class.btn-primary]="app.confirmDialog().type === 'primary'" 
        [class.btn-success]="app.confirmDialog().type === 'success'" 
        (click)="app.handleConfirmDialogAction()">
        {{ app.confirmDialog().confirmText }}
      </button>
    </div>

  </div>
</div>
