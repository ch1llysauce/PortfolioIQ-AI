<div class="app-layout">
  <!-- MOBILE SIDEBAR BACKDROP -->
  <div class="sidebar-backdrop" *ngIf="mobileSidebarOpen()" (click)="closeMobileSidebar()"></div>

  <!-- LEFT SIDEBAR NAVIGATION (UI 2 Wireframe Spec) -->
  <aside app-sidebar class="sidebar" [class.mobile-open]="mobileSidebarOpen()"></aside>

  <!-- MAIN CONTENT AREA -->
  <div class="main-wrapper">
    <!-- TOP HEADER -->
    <header app-header class="top-header"></header>

    <!-- CONTENT BODY -->
    <main class="content-container" [class.coach-active]="activeTab() === 'coach'">
      <!-- 1. DASHBOARD TAB -->
      <div app-dashboard *ngIf="activeTab() === 'dashboard'" class="tab-pane"></div>

      <!-- 2. PROJECTS TAB -->
      <div app-projects *ngIf="activeTab() === 'projects'" class="tab-pane projects-tab-pane"></div>

      <!-- 3. MY SKILLS PROFILE TAB -->
      <div app-skills *ngIf="activeTab() === 'skills'" class="tab-pane"></div>

      <!-- 4. CAREER PATHWAYS & GAP OPTIMIZER TAB -->
      <div app-career *ngIf="activeTab() === 'career'" class="tab-pane"></div>

      <!-- 5. RESUME EXTRACTOR TAB -->
      <div app-resume *ngIf="activeTab() === 'resume'" class="tab-pane resume-tab-pane"></div>

      <!-- 6. KNOWLEDGE GRAPH TAB -->
      <div app-knowledge *ngIf="activeTab() === 'knowledge'" class="tab-pane"></div>

      <!-- 7. AI CAREER COACH TAB -->
      <div app-coach *ngIf="activeTab() === 'coach'" class="tab-pane coach-tab-pane coach-main-canvas"></div>

      <!-- 8. GITHUB PROFILE SCANNER & IMPORTER TAB -->
      <div app-github *ngIf="activeTab() === 'github'" class="tab-pane"></div>
    </main>
  </div>
</div>

     GLOBAL MODALS, OVERLAYS & PORTALS (Modular Components)
